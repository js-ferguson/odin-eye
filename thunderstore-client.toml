# Thunderstore package config for OdinEye.Client (ODINEYE-21). Built/published
# via `tcli` (https://github.com/thunderstore-io/thunderstore-cli) from
# release.yaml, gated behind the THUNDERSTORE_TOKEN secret -- same
# "only runs if configured" pattern as this repo's NUGET_API_KEY-gated steps.
# Lives at repo root (not alongside icon.png/README.md in thunderstore/client/)
# because tcli's [[build.copy]] `source` paths are resolved relative to
# wherever tcli is invoked from, and CI always runs from the repo root where
# the client's built dist/OdinEye.Client/ files actually land.
#
# Verified live via release.yaml's automated `tcli publish` step across
# several real releases since (v1.2.24 onward at least) -- this comment
# originally warned it was untested; no longer true, kept only as history.

[config]
schemaVersion = "0.0.1"

[package]
namespace = "SeasonedProfessionals"
name = "OdinEyeClient"
# Placeholder -- release.yaml overwrites this to match the release tag
# (stripped of its leading "v") before running tcli.
versionNumber = "0.0.0"
# Thunderstore's own description field is capped at 250 characters --
# checked against that limit by hand (228 here), since tcli/the API give
# no useful error if it's ever exceeded.
description = "Optional OdinEye companion: submits your character's real lifetime stats and progress toward your server's custom achievements to your server's OdinEye instance -- needed for achievements to track, not for basic server function."
websiteUrl = "https://github.com/js-ferguson/odin-eye"
containsNsfwContent = false

[package.dependencies]
# Keep in sync with whatever BepInEx version this repo's own
# packages.config files (BepInEx.BaseLib/BepInEx.Core) are actually built
# and tested against -- check https://valheim.thunderstore.io/package/denikson/BepInExPack_Valheim/
# for the current version if this ever needs bumping.
denikson-BepInExPack_Valheim = "5.4.2350"

[build]
icon = "./thunderstore/client/icon.png"
readme = "./thunderstore/client/README.md"
outdir = "./dist/thunderstore"

# Sources should match release.yaml's PrepPlugin-driven dist/OdinEye.Client/
# output exactly (see OdinEye.Client.csproj's own PrepPlugin target for the
# authoritative file list) -- target "plugins/" mirrors BepInEx's own
# folder layout, which is what every mod manager expects inside a
# Thunderstore package zip.
#
# THIS LIST IS NOT AUTOMATICALLY KEPT IN SYNC WITH PrepPlugin -- it's a
# separate, hand-maintained [[build.copy]] list because tcli has no way to
# just "copy everything PrepPlugin staged." Confirmed live this drifts for
# real: v1.2.7's PrepPlugin fix (adding System.Threading.Tasks.Extensions.dll)
# shipped correctly to the GitHub release zip (built straight from
# dist/OdinEye.Client/) but NOT to Thunderstore, since tcli only copies what's
# listed below -- a real player's client kept failing on v1.2.7 until this
# list caught up in a follow-up release. Whenever PrepPlugin's PackageItems
# list changes, this list (and thunderstore-server.toml's) must change too.
[[build.copy]]
source = "dist/OdinEye.Client/OdinEye.Client.dll"
target = "plugins/"

[[build.copy]]
source = "dist/OdinEye.Client/OdinEye.Models.dll"
target = "plugins/"

[[build.copy]]
source = "dist/OdinEye.Client/NGuid.dll"
target = "plugins/"

[[build.copy]]
source = "dist/OdinEye.Client/Utf8Json.dll"
target = "plugins/"

[[build.copy]]
source = "dist/OdinEye.Client/System.Threading.Tasks.Extensions.dll"
target = "plugins/"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]
# Confirmed-correct slug, but not actually applied by tcli 0.2.4 on
# publish -- see thunderstore-server.toml's matching comment. Set
# manually via the Thunderstore website instead; that sticks across
# future automated releases regardless of what this field does.
categories = ["client-side"]
