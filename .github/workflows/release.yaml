name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: write

env:
  # Empty on any fork that hasn't configured this secret (it's not copied
  # from upstream automatically) -- gates the nuget-publish steps below,
  # which are upstream-specific and unrelated to producing the plugin zip.
  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
  # Same gating pattern, for the Thunderstore-publish steps below
  # (ODINEYE-21) -- a Thunderstore Service Account token, from
  # thunderstore.io -> Settings -> Teams -> Service Accounts.
  THUNDERSTORE_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1.0.5
      - name: Restore Packages
        run: nuget restore OdinEye.sln
      - name: Build server and client plugin packages
        # PluginFolder/ClientPluginFolder override OdinEye.csproj's and
        # OdinEye.Client.csproj's own PrepPlugin post-build targets (normally
        # hardcoded local Steam paths) so each stages its actual runtime
        # file set -- the plugin dll plus its third-party dependencies, not
        # the Unity/Valheim/BepInEx reference assemblies those are compiled
        # against -- into a workspace-local folder we can zip up below. Those
        # targets are the single source of truth for which files ship; this
        # workflow never duplicates either list.
        run: msbuild OdinEye.sln -t:rebuild -property:Configuration=Release -property:PluginFolder=${{ github.workspace }}\dist\OdinEye -property:ClientPluginFolder=${{ github.workspace }}\dist\OdinEye.Client

      - name: Zip plugin packages
        # Contents at each zip's root (no wrapping folder) -- matches what
        # valheim_server's mods-install-manual.sh expects when it extracts
        # a manually-uploaded/GitHub-sourced zip straight into the mod's
        # plugins/ subfolder. The client package is optional for players
        # (ODINEYE-20): installing it only adds client-submitted character
        # stats to what the server-side package already provides on its own.
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/OdinEye/*" -DestinationPath "dist/OdinEye-${{ github.event.release.tag_name }}.zip"
          Compress-Archive -Path "dist/OdinEye.Client/*" -DestinationPath "dist/OdinEye.Client-${{ github.event.release.tag_name }}.zip"

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Attaches to the SAME release that triggered this workflow, so
        # admin panels/tools that pick "the one .zip on the latest release"
        # (e.g. valheim_server's GitHub-mod-install) find it immediately.
        # Two assets now ship per release: the server plugin (required) and
        # the optional client plugin.
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/OdinEye-${{ github.event.release.tag_name }}.zip" "dist/OdinEye.Client-${{ github.event.release.tag_name }}.zip" --clobber

      # Publishes OdinEye.Models to nuget.org -- upstream-specific, and
      # only runs if NUGET_API_KEY is actually configured on this repo.
      - uses: actions/setup-dotnet@v3
        if: ${{ env.NUGET_API_KEY != '' }}
        with:
          dotnet-version: '6.0.x'
      - name: Generate nuget package
        if: ${{ env.NUGET_API_KEY != '' }}
        run: dotnet pack src/OdinEye.Models/OdinEye.Models.csproj -p:Version='${{ github.event.release.tag_name }}' --configuration Release -o nupkg
      - name: Upload nuget package
        if: ${{ env.NUGET_API_KEY != '' }}
        run: dotnet nuget push .\nupkg\*.nupkg -k $env:NUGET_API_KEY -s https://api.nuget.org/v3/index.json

      # Publishes OdinEye.Client to Thunderstore (ODINEYE-21) -- only runs
      # if THUNDERSTORE_TOKEN is actually configured. NOT verified end-to-end
      # against a real Thunderstore account -- see thunderstore-client.toml's
      # own header comment. If this step ever needs debugging, split
      # `tcli publish` back into a `tcli build` + manual zip inspection first.
      - uses: actions/setup-dotnet@v3
        if: ${{ env.THUNDERSTORE_TOKEN != '' }}
        with:
          dotnet-version: '6.0.x'
      - name: Install tcli
        if: ${{ env.THUNDERSTORE_TOKEN != '' }}
        run: dotnet tool install -g tcli
      - name: Set Thunderstore package version
        if: ${{ env.THUNDERSTORE_TOKEN != '' }}
        # thunderstore-client.toml's versionNumber is just a placeholder --
        # Thunderstore version numbers have no leading "v", unlike this
        # repo's own git tags/zip filenames.
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}" -replace '^v', ''
          (Get-Content thunderstore-client.toml) -replace 'versionNumber = "0.0.0"', "versionNumber = ""$version""" | Set-Content thunderstore-client.toml
      - name: Publish OdinEye.Client to Thunderstore
        run: tcli publish --config-path thunderstore-client.toml --token $env:THUNDERSTORE_TOKEN
        if: ${{ env.THUNDERSTORE_TOKEN != '' }}
