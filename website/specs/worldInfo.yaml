openapi: 3.0.0
info:
  title: OdinEye API
  description: OdinEye API Specification
  version: v1
servers:
  - url: http://localhost:2469
tags:
  - name: world
    description: World related resources
    x-displayName: World

paths:
  /worldDetails:
    get:
      tags:
        - world
      summary: Retrieve game world info
      description: Returns general game world information.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldDetails'

components:
  schemas:
    WorldDetails:
      properties:
        DayNumber:
          type: integer
          description: The current in-game day.
          format: int32
          minimum: 1
          example: 12
        DayCycle:
          description: The current in-game day cycle.
          type: string
          enum:
            - morning
            - afternoon
            - night
            - unknown
        NetTime:
          description: |-
            Live, in-game elapsed seconds (`ZNet`'s own network time). Finer-grained
            than `DayNumber` -- use this to render an actual time-of-day clock rather
            than just a day count (`DayNumber` is `NetTime` divided by the day length).
          type: number
          format: double
          example: 187452.3
        WorldName:
          description: Name of the game world.
          type: string
          minLength: 1
          example: Dedicated
        SeedName:
          description: Name of the game world seed.
          type: string
          minLength: 1
          example: 3BdkT6jHFn
        WorldKeys:
          description: The world's starting global keys.
          type: array
          items:
            type: string
            minLength: 1
        GlobalKeys:
          description: |-
            Every global key the world currently has, whatever set it -- boss
            defeats, active random events, the world's difficulty preset (see
            `GET /worldModifiers`), and anything a future game update adds. Not a
            fixed set: treat unrecognized names as normal, forward-compatible data.
          type: array
          items:
            $ref: '#/components/schemas/GlobalKey'
    GlobalKey:
      description: Represents a global key.
      properties:
        Name:
          description: |-
            Name of the global key, e.g. `activebosses`, `defeated_gdking`,
            `killedtroll`, or `preset`.
          type: string
          minLength: 1
          example: defeated_gdking
        Value:
          description: |-
            Value of the global key. For most keys this is an empty string; a
            handful (e.g. `activebosses`, `preset`) carry real data.
          type: string
