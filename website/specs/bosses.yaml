openapi: 3.0.0
info:
  title: OdinEye API
  description: OdinEye API Specification
  version: v1
servers:
  - url: http://localhost:2469
tags:
  - name: boss
    description: Boss related resources
    x-displayName: Bosses

paths:
  /bossDetails:
    get:
      tags:
        - boss
      summary: Retrieve boss progression
      description: Returns every boss with its name, key and defeated status, plus how many are currently active (summoned but not yet defeated).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BossDetails'

components:
  schemas:
    BossDetails:
      description: Represents boss progression.
      type: object
      properties:
        ActiveBosses:
          type: integer
          description: Number of currently active (summoned, not yet defeated) bosses.
          format: int32
          minimum: 0
          example: 0
        Bosses:
          type: array
          items:
            $ref: '#/components/schemas/Boss'
          description: |-
            Always the same six bosses, in this order: Eikthyr, The Elder,
            Bonemass, Moder, Yagluth, The Queen.
    Boss:
      description: Represents a boss.
      type: object
      properties:
        Key:
          description: Key of the boss.
          type: string
          minLength: 1
          example: gdking
        Name:
          description: Name of the boss.
          type: string
          minLength: 1
          example: The Elder
        IsDefeated:
          description: If true, the boss has been defeated.
          type: boolean
